name: 🎓 Send Certificates

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Database event ID from events_event.id. Leave blank for all events."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Generate certificates and build the queue without sending emails or deploying."
        required: false
        default: true
        type: boolean
      retry_failed:
        description: "Retry only previously failed certificate emails."
        required: false
        default: false
        type: boolean
      max_retries:
        description: "Maximum email attempts per participant."
        required: false
        default: "3"
        type: string
      attendance_statuses:
        description: "Comma-separated events_registration.status values considered attended."
        required: false
        default: "attended"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: 📂 Restore previous queue
        if: ${{ inputs.retry_failed == true }}
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: cert-queue-${{ inputs.event_id || 'all' }}
          restore-keys: |
            cert-queue-${{ inputs.event_id || 'all' }}-

      - name: 🔍 Fetch attended participants
        if: ${{ inputs.retry_failed == false }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ATTENDED_STATUSES: ${{ inputs.attendance_statuses }}
          FEST_NAME: ${{ secrets.FEST_NAME }}
        run: |
          set -e

          if [ -n "${{ inputs.event_id }}" ]; then
            echo "Fetching attended participants for event ID: ${{ inputs.event_id }}"
            python generator/fetch_attendees.py --event-id "${{ inputs.event_id }}"
          else
            echo "Fetching attended participants for ALL events"
            python generator/fetch_attendees.py --all-events
          fi

      - name: 🎨 Generate certificates
        if: ${{ inputs.retry_failed == false }}
        env:
          FEST_NAME: ${{ secrets.FEST_NAME }}
        run: |
          set -e

          if [ -n "${{ inputs.event_id }}" ]; then
            python generator/generate.py --event-id "${{ inputs.event_id }}"
          else
            python generator/generate.py --all-events
          fi

      - name: 🌐 Build verification site
        if: ${{ inputs.dry_run == false && inputs.retry_failed == false }}
        env:
          FEST_NAME: ${{ secrets.FEST_NAME }}
        run: |
          set -e

          if [ -n "${{ inputs.event_id }}" ]; then
            python generator/build_site.py --event-id "${{ inputs.event_id }}"
          else
            python generator/build_site.py --all-events
          fi

      - name: 🚀 Deploy verification site
        if: ${{ inputs.dry_run == false && inputs.retry_failed == false }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: cert.astraietm.in
          keep_files: true

      - name: 📧 Send certificate emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          CERT_VERIFY_BASE_URL: https://cert.astraietm.in
        run: |
          set -e

          if [ -n "${{ inputs.event_id }}" ]; then
            QUEUE_FILE="data/event_${{ inputs.event_id }}_queue.json"
            EVENT_ARGS="--event-id ${{ inputs.event_id }}"
          else
            QUEUE_FILE="data/all_queue.json"
            EVENT_ARGS="--all-events"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EVENT_ARGS="$EVENT_ARGS --dry-run"
          fi

          if [ "${{ inputs.retry_failed }}" = "true" ]; then
            EVENT_ARGS="$EVENT_ARGS --retry-failed"
          elif [ -f "$QUEUE_FILE" ]; then
            EVENT_ARGS="$EVENT_ARGS --resume"
          fi

          python generator/send_emails.py $EVENT_ARGS --max-retries "${{ inputs.max_retries }}"

      - name: 💾 Save queue state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: cert-queue-${{ inputs.event_id || 'all' }}-${{ github.run_number }}

      - name: 📊 Print queue summary
        if: always()
        run: |
          if [ -n "${{ inputs.event_id }}" ]; then
            python generator/send_emails.py --event-id "${{ inputs.event_id }}" --status
          else
            python generator/send_emails.py --all-events --status
          fi

      - name: 📤 Upload certificates
        if: ${{ always() && inputs.retry_failed == false }}
        uses: actions/upload-artifact@v4
        with:
          name: certificates-${{ inputs.event_id || 'all-events' }}-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 90

      - name: 📤 Upload generated data and queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-data-${{ inputs.event_id || 'all-events' }}-run-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
