name: 🎓 Send Certificates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = only show the events in the database (nothing is generated or sent). send = process the events chosen below."
        required: true
        default: list
        type: choice
        options:
          - list
          - send
      events:
        description: "mode=send only. Event IDs, comma-separated (e.g. 3,7), or 'all'. Run mode=list first to see the IDs."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Generate certificates without sending emails or deploying the verification site."
        required: false
        default: true
        type: boolean
      max_retries:
        description: "Maximum email attempts per participant."
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Never let two sends overlap - that is how people get duplicate certificates.
concurrency:
  group: send-certificates
  cancel-in-progress: false

jobs:
  # 1. Always: read the events from the database and show them.
  list-events:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: 📋 List events from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python generator/list_events.py --summary

  # 2. mode=send only: validate the chosen events, then generate + send.
  send:
    needs: list-events
    if: ${{ inputs.mode == 'send' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: ✅ Validate selected events
        id: select
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EVENTS_INPUT: ${{ inputs.events }}
        run: python generator/list_events.py --select "$EVENTS_INPUT"

      - name: 🔍 Fetch attended participants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FEST_NAME: ${{ secrets.FEST_NAME }}
          EVENT_IDS: ${{ steps.select.outputs.ids }}
        run: |
          set -e
          for id in $EVENT_IDS; do
            echo "::group::Fetch event $id"
            python generator/fetch_attendees.py --event-id "$id"
            echo "::endgroup::"
          done

      - name: 🎨 Generate certificates
        env:
          FEST_NAME: ${{ secrets.FEST_NAME }}
          EVENT_IDS: ${{ steps.select.outputs.ids }}
        run: |
          set -e
          for id in $EVENT_IDS; do
            echo "::group::Generate event $id"
            python generator/generate.py --event-id "$id"
            echo "::endgroup::"
          done

      - name: 🌐 Build verification site
        if: ${{ !inputs.dry_run }}
        env:
          FEST_NAME: ${{ secrets.FEST_NAME }}
          EVENT_IDS: ${{ steps.select.outputs.ids }}
        run: |
          set -e
          for id in $EVENT_IDS; do
            echo "::group::Build site for event $id"
            python generator/build_site.py --event-id "$id"
            echo "::endgroup::"
          done

      - name: 🚀 Deploy verification site
        if: ${{ !inputs.dry_run }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: cert.astraietm.in
          keep_files: true

      - name: 📧 Send certificate emails
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          CERT_VERIFY_BASE_URL: https://cert.astraietm.in
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EVENT_IDS: ${{ steps.select.outputs.ids }}
          MAX_RETRIES: ${{ inputs.max_retries }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [[ "$MAX_RETRIES" =~ ^[0-9]+$ ]] || { echo "max_retries must be a number"; exit 1; }

          ARGS=(--max-retries "$MAX_RETRIES")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          # Supabase certificate_sent is the source of truth, so re-running an
          # event never re-sends to someone who already got their certificate.
          # One event failing must not stop the others - report at the end.
          failed=0
          for id in $EVENT_IDS; do
            echo "::group::Send event $id"
            python generator/send_emails.py --event-id "$id" "${ARGS[@]}" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: 📊 Print queue summary
        if: always() && steps.select.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EVENT_IDS: ${{ steps.select.outputs.ids }}
        run: |
          for id in $EVENT_IDS; do
            python generator/send_emails.py --event-id "$id" --status || true
          done

      - name: 📤 Upload certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificates-${{ steps.select.outputs.tag || 'none' }}-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 90

      - name: 📤 Upload generated data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-data-${{ steps.select.outputs.tag || 'none' }}-run-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 30
